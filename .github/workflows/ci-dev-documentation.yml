# Pipeline that checks the documentation when changed

name: CI Dev branch documentation

on:
  push:
    branches: [ "dev" ]            # trap each push to dev branch
    paths:                         # but react only to changes in code or pipeline definition
      - .github/workflows/ci-dev-documentation.yml
      - documentation/user/**.*

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ format('{0}_documentation', github.ref_name) }}  # for the same branch (dev)
  cancel-in-progress: true        # run only one workflow at a time (cancel the previous)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 checkout sources
      with:
        persist-credentials: false

    - name: Setup Java JDK
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0  # setup JDK 17 for building
      with:
         distribution: 'temurin'
         java-version: '17'
         cache: 'maven'

    - name: Setup dotnet
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '8.0.X'    # setup dotnet 8.0.X for building

    - name: Build with Maven       # run Maven with tests; RoaringBitmap's vendored suite is irrelevant
      run: |                       # here and must stay skipped, else it drowns out the doc test report
        mvn -T 1C -B package -P documentation -V --fail-at-end -Dmaven.test.skip=false -DroaringBitmap.skipTests=true --file pom.xml

    - name: Upload test results    # upload XML with unit test results for debugging
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: success() || failure()
      with:
        name: test-results
        path: 'evita*/**/target/surefire-reports/TEST-*.xml'
        retention-days: 14

    - name: Publish Test Report
      uses: ./.github/actions/publish-test-report
      if: success() || failure()
