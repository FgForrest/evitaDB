# PR validation pipeline: build + test + AI code review

name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev]
    paths:
      - evita*/**/*.java
      - evita*/**/pom.xml
      - pom.xml
      - .github/**

concurrency:
  group: pr-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Java JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build with Maven
        run: |
          mvn -T 1C -B package -P unitAndFunctional,full jacoco:report-aggregate -V --fail-at-end -Dmaven.test.skip=false --file pom.xml
          jacoco/jacoco-summary.sh jacoco/target/site/jacoco-aggregate/jacoco.csv

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() || failure()
        with:
          name: test-results
          path: 'evita*/**/target/surefire-reports/TEST-*.xml'

      - name: Publish Test Report
        uses: ./.github/actions/publish-test-report
        if: success() || failure()

  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: anthropics/claude-code-action@787c5a0ce96a9a6cfb050ea0c8f4c05f2447c251 # v1.0.133
        with:
          claude_code_oauth_token: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request for evitaDB, a specialized NoSQL
            in-memory database for e-commerce written in Java.

            First, read the file `.claude/agents/pr-reviewer.md` in the repository
            root. That file contains your complete review persona, instructions,
            and checklist. Follow every instruction in that file precisely.

            The PR branch is already checked out in the current working directory.
            The repository also contains a `CLAUDE.md` file with the project's
            coding standards — use it as your reference for style compliance.

            Use `gh pr diff ${{ github.event.pull_request.number }}` to examine
            the changes. Use inline comments for file-specific feedback and a
            single summary comment on the PR for overall assessment.

            IMPORTANT — this PR may have been reviewed before (PRs are re-reviewed
            on every push). Before posting any findings, fetch and read the full
            review history via `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews`,
            `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`,
            and `gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments`.
            Build threaded views via `in_reply_to_id`. Do NOT re-raise concerns
            that a prior round already raised and that the author addressed,
            rebutted, or fixed. See Step 2 of `.claude/agents/pr-reviewer.md` for
            the full procedure.

          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*)"
