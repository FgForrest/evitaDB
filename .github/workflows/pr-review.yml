# PR validation pipeline: build + test + AI code review

name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev]
    paths:
      - evita*/**/*.java
      - evita*/**/pom.xml
      - pom.xml
      - .github/**

concurrency:
  group: pr-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Detect RoaringBitmap module changes   # colocated vendor test suite - skip it unless
        id: roaring-filter                          # this PR actually touches that module or the
        env:                                         # root pom.xml (build/toolchain changes)
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if files=$(gh pr diff "$PR_NUMBER" --name-only 2>&1); then
            if echo "$files" | grep -qE '^(evita_roaring_bitmap/|pom\.xml$)'; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Could not compute PR diff - running RoaringBitmap tests to be safe: $files"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Print runner memory info   # ground truth for surefire -Xmx sizing; GitHub's documented runner
        run: |                           # specs are per-VM totals, not necessarily what this job can safely use
          echo "--- nproc ---"; nproc
          echo "--- free -h ---"; free -h
          echo "--- /proc/meminfo ---"; cat /proc/meminfo
          echo "--- cgroup v2 memory.max ---"; cat /sys/fs/cgroup/memory.max 2>/dev/null || echo "n/a"
          echo "--- cgroup v1 memory.limit_in_bytes ---"; cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || echo "n/a"
          echo "--- ulimit -a ---"; ulimit -a

      - name: Build with Maven
        # surefire.useUnlimitedThreads/threadCount cap test-thread fan-out to this runner's actual
        # core count (nproc, printed by the step above) - unbounded fan-out on a 4-core runner can
        # balloon off-heap memory (Netty/gRPC buffers per concurrently-alive embedded test instance)
        # well past -Xmx and get the whole job OS-killed; see the surefire-plugin comment in pom.xml
        run: |
          mvn -T 1C -B package -P unitAndFunctional,full jacoco:report-aggregate -V --fail-at-end -Dmaven.test.skip=false -Dsurefire.useUnlimitedThreads=false -Dsurefire.threadCount=4 -DroaringBitmap.skipTests=${{ steps.roaring-filter.outputs.changed == 'true' && 'false' || 'true' }} --file pom.xml
          jacoco/jacoco-summary.sh jacoco/target/site/jacoco-aggregate/jacoco.csv

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() || failure()
        with:
          name: test-results
          path: 'evita*/**/target/surefire-reports/TEST-*.xml'

      - name: Publish Test Report
        uses: ./.github/actions/publish-test-report
        if: success() || failure()

  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: anthropics/claude-code-action@36a69b6a90b850823f86de06fdfd56264772ad98 # v1.0.134
        with:
          claude_code_oauth_token: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request for evitaDB, a specialized NoSQL
            in-memory database for e-commerce written in Java.

            First, read the file `.claude/agents/pr-reviewer.md` in the repository
            root. That file contains your complete review persona, instructions,
            and checklist. Follow every instruction in that file precisely.

            The PR branch is already checked out in the current working directory.
            The repository also contains a `CLAUDE.md` file with the project's
            coding standards — use it as your reference for style compliance.

            Use `gh pr diff ${{ github.event.pull_request.number }}` to examine
            the changes. Use inline comments for file-specific feedback and a
            single summary comment on the PR for overall assessment.

            IMPORTANT — this PR may have been reviewed before (PRs are re-reviewed
            on every push). Before posting any findings, fetch and read the full
            review history via `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews`,
            `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`,
            and `gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments`.
            Build threaded views via `in_reply_to_id`. Do NOT re-raise concerns
            that a prior round already raised and that the author addressed,
            rebutted, or fixed. See Step 2 of `.claude/agents/pr-reviewer.md` for
            the full procedure.

          claude_args: |
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*)"
