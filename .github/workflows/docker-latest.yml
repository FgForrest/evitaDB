# This job builds and deploys Docker image to DockerHub

name: DockerHub-deploy

on:
  # There used to also be a `workflow_run: workflows: ['CI Release branch']`
  # trigger here. It was removed while CI Release branch was still dispatched
  # from CI Master under GITHUB_TOKEN, whose runs' completions never cascade
  # into further automatic triggers. CI Release branch is now started by the
  # release bot App's push, which would cascade, but it keeps dispatching
  # this workflow explicitly and passes its own run_id so this can pull
  # evita-server.jar/version.txt as workflow artifacts instead of from the
  # release's zip asset — the release is typically still a draft at that
  # point (publishing happens later, separately), and a draft release has no
  # real downloadable git tag yet. Re-adding the listener would publish twice.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v2025.7.18).'
        required: true
        type: string
      run_id:
        description: >-
          Run id of the CI Release branch run to pull evita-server.jar/version.txt
          artifacts from. Leave empty to instead download dist.zip from the
          (already published) GitHub release for "version" — the original
          manual-recovery path.
        required: false
        default: ''
        type: string
      push_latest:
        description: 'Force the :latest decision instead of auto-computing it. "auto" (default) pushes :latest when this version is the newest known release line (by YYYY.MM); "true"/"false" override that.'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - "true"
          - "false"

permissions:
  contents: read          # Required for actions/checkout to read the repository
  actions: read           # Required to download artifacts from the dispatching workflow's run

jobs:
  on-success:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1        # checkout from Git
        with:
          ref: master  # Always checks out the master branch (due to config file)
          persist-credentials: false

      # Resolve where the JAR comes from. Whether :latest gets pushed is
      # decided later (see "Determine whether to push :latest" below) once
      # the version number is known — releases now ship from release_YYYY-M
      # branches (both new majors and maintenance patches), so the upstream
      # branch name can no longer answer "is this the newest line"; only a
      # comparison against other releases' version numbers can.
      - name: Resolve build inputs
        id: inputs
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          INPUT_PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          echo "version_tag=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          echo "push_latest_override=$INPUT_PUSH_LATEST" >> "$GITHUB_OUTPUT"
          if [ -n "$INPUT_RUN_ID" ]; then
            echo "source=workflow_artifact" >> "$GITHUB_OUTPUT"
            echo "run_id=$INPUT_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            echo "source=release_asset" >> "$GITHUB_OUTPUT"
          fi

      - name: Download a JAR file to deploy # download `evita-server.jar` artifact from the dispatching run
        if: steps.inputs.outputs.source == 'workflow_artifact'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ steps.inputs.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}   # cross-run download needs an explicit token
          name: evita-server.jar
          path: docker

      - name: Download a version information # download `version.txt` artifact from the dispatching run
        if: steps.inputs.outputs.source == 'workflow_artifact'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ steps.inputs.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}   # cross-run download needs an explicit token
          name: version.txt

      # Recovery path: pull dist.zip from the release, extract evita-server.jar
      # into ./docker, and synthesise version.txt so the downstream "Extract
      # major version" step (and Dockerfile build args) keep working unchanged.
      - name: Download dist.zip from release
        if: steps.inputs.outputs.source == 'release_asset'
        env:
          VERSION_TAG: ${{ steps.inputs.outputs.version_tag }}
        run: |
          gh release download "$VERSION_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "evitaDB-${VERSION_TAG}.zip" \
            --output dist.zip
          unzip -j dist.zip 'dist/evita-server.jar' -d docker/
          printf '%s\n' "${VERSION_TAG#v}" > version.txt

      - name: Set up QEMU
        # Add support for more platforms with QEMU (optional)
        # https://github.com/docker/setup-qemu-action
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Configure QEMU
        # Configure QEMU for Docker Buildx, see https://github.com/docker/buildx/issues/1170#issuecomment-2424530330
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes -c yes

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-flags: --debug
          platforms: linux/amd64,linux/arm64/v8

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.CI_REGISTRY_USER }}
          password: ${{ secrets.CI_REGISTRY_PASSWORD }}

      - name: Extract major version
        # create a new output variable with the major version (like 2024.4)
        run: |
          if ! grep -Eq '^[0-9]{4}\.[0-9]+\.[0-9]+$' version.txt; then
            echo "Invalid version format in version.txt"
            exit 1
          fi
          export sanitizedVersionContents=$(tr -d '\r\n' < version.txt)
          fullVersion=$sanitizedVersionContents
          version=$(echo "$sanitizedVersionContents" | cut -d '.' -f1,2)
          echo "fullVersion=$fullVersion" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_ENV"
          releaseDate=$(date +%Y-%m-%d)
          echo "releaseDate=$releaseDate" >> "$GITHUB_ENV"

      # Decide whether this build should also become :latest. A legacy
      # maintenance-branch patch (e.g. v2026.1.21, released after v2026.2.0
      # already shipped) must not regress :latest away from the newest line.
      # "Newest" is resolved by comparing this release's YYYY.MM against
      # every other PUBLISHED release's YYYY.MM (via the GitHub API) — never
      # by branch name, since every release (new major or maintenance patch)
      # now ships from a release_YYYY-M branch and branch name can't tell
      # them apart. This release's own version is injected into the
      # comparison explicitly because its GitHub release may still be a
      # draft at this point (release-notes enrichment/publish happens
      # later), so it wouldn't show up as "published" yet.
      - name: Determine whether to push :latest
        id: latest
        env:
          OVERRIDE: ${{ steps.inputs.outputs.push_latest_override }}
          VERSION: ${{ env.version }}
        run: |
          if [ "$OVERRIDE" = "true" ] || [ "$OVERRIDE" = "false" ]; then
            echo "push_latest=$OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "Using explicit override: push_latest=$OVERRIDE"
            exit 0
          fi

          OTHER=$(gh api "/repos/${{ github.repository }}/releases?per_page=100" --paginate \
            --jq '.[] | select(.draft == false) | .tag_name' \
            | grep -E '^v[0-9]{4}\.[0-9]+\.[0-9]+$' \
            | sed -E 's/^v([0-9]+\.[0-9]+)\..*/\1/' || true)

          # An empty result here almost certainly means the API call failed
          # or got throttled, not that no release has ever been published.
          # Trusting an empty $OTHER would make $VERSION trivially "the
          # highest" and push :latest unconditionally — the exact failure
          # this workflow exists to prevent — so fail loudly instead.
          if [ -z "$OTHER" ]; then
            echo "::error::no published releases enumerated via the GitHub API — refusing to guess :latest"
            exit 1
          fi

          HIGHEST=$(printf '%s\n%s\n' "$OTHER" "$VERSION" | grep -v '^$' | sort -V -u | tail -1)

          echo "Known release lines (incl. this one): $(printf '%s\n%s\n' "$OTHER" "$VERSION" | grep -v '^$' | sort -V -u | tr '\n' ' ')"
          echo "Highest: $HIGHEST — this release: $VERSION"

          if [ "$HIGHEST" = "$VERSION" ]; then
            echo "push_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "push_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        env:
          RELEASE_IMAGE: "evitadb:latest"
          EVITA_JAR_NAME: evita-server.jar
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./docker
          file: ./docker/Dockerfile
          pull: true
          push: true
          # The :latest tag is gated on push_latest (resolved above) so that a
          # legacy maintenance-branch release (e.g. v2025.7.x) does not regress
          # :latest away from a newer release line. Empty lines in the tag
          # list are filtered by docker/build-push-action.
          tags: |
            ${{ steps.latest.outputs.push_latest == 'true' && format('{0}/{1}', vars.CI_REGISTRY_USER, env.RELEASE_IMAGE) || '' }}
            ${{ vars.CI_REGISTRY_USER }}/evitadb:${{ env.version }}
            ${{ vars.CI_REGISTRY_USER }}/evitadb:${{ env.fullVersion }}
          platforms: linux/amd64,linux/arm64/v8
          build-args: |
            EVITA_JAR_NAME=${{ env.EVITA_JAR_NAME }}
            VERSION=${{ env.fullVersion }}
            RELEASE_DATE=${{ env.releaseDate }}
