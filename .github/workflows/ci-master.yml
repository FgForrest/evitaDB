# Main build pipeline, operates on `master` branch which is our integration branch

name: CI Master branch

on:
  workflow_dispatch:              # allows manual triggering from GitHub UI or CLI
  push:
    branches:
      - "master"                   # trap each push to master branch
    paths:                         # but react only to changes in code or pipeline definition
      - evita*/**/*.java
      - evita*/**/pom.xml
      - jacoco/**/pom.xml
      - evita*/**/dist/**.*
      - docker/**
      - .github/**

concurrency:
  group: ${{ github.ref_name }}   # for the same branch
  cancel-in-progress: true        # run only one workflow at a time (cancel the previous)

jobs:
  build:
    permissions:
      # write permission is required to create a github release
      contents: write
      # required to dispatch the CI Release branch workflow below — a plain
      # push wouldn't do it: pushes authenticated with the default
      # GITHUB_TOKEN never trigger downstream `on: push` workflows (GitHub's
      # anti-recursion guard), `workflow_dispatch` is explicitly exempted
      actions: write
    outputs:
      released_version: ${{ steps.release_version.outputs.version }}
      release_branch: ${{ steps.release_branch.outputs.branch }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 checkout sources
      with:
        fetch-depth: 0

    - name: Setup Java JDK
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0  # setup JDK 17 for building
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'maven'

    - name: Compilation Check
      # `evita_long_running_tests` is excluded: it depends on the `test-jar` of `evita_functional_tests`,
      # which is not produced under `-Dmaven.test.skip=true`, so it would fail dependency resolution.
      # It is a non-published leaf test module with no main sources, so excluding it loses no compile coverage.
      run: |
        mvn -T 1C -B -P full -Dmaven.test.skip=true install -pl '!:evita_long_running_tests' --file pom.xml

    - name: PGP Keys Check
      # `evita_long_running_tests` is excluded for the same reason as in Compilation Check:
      # this is a bare goal invocation, so it never runs `package` for `evita_functional_tests`,
      # and that module's test-jar (consumed by `evita_long_running_tests`) is never produced or
      # installed (`maven.install.skip=true`), so dependency resolution would fail otherwise.
      run: |
        mvn org.simplify4u.plugins:pgpverify-maven-plugin:check -pl '!:evita_long_running_tests'

    - name: Duplicate Classes Check
      # See PGP Keys Check above for why `evita_long_running_tests` is excluded.
      run: |
        mvn duplicate-finder:check -pl '!:evita_long_running_tests'

    # Only used below to name the release branch (e.g. "2026.2" -> release_2026-2).
    # The actual published version (including patch number) is resolved by
    # CI Release branch itself once dispatched onto that branch — this repo's
    # pom.xml version never carries a patch number, so it can't tell a first
    # ".0" cut apart from the Nth hotfix on an already-released minor.
    - name: Resolve new release version
      id: release_version
      run: |
        # Extract version from pom.xml
        POM_VERSION=$(grep -m 1 '<version>' pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
        echo "Extracted pom.xml version: $POM_VERSION"

        # Remove -SNAPSHOT suffix and convert to version format with .0 patch
        VERSION=$(echo "$POM_VERSION" | sed 's/-SNAPSHOT$//')
        VERSION_WITH_PATCH="v${VERSION}.0"

        echo "version=$VERSION_WITH_PATCH" >> $GITHUB_OUTPUT
        echo "Release version: $VERSION_WITH_PATCH"

    - name: Determine release branch name
      id: release_branch
      env:
        VERSION: ${{ steps.release_version.outputs.version }}
      run: |
        # Extract version without 'v' prefix and remove patch version
        VERSION_WITHOUT_PREFIX="${VERSION#v}"
        MAJOR_MINOR=$(echo "$VERSION_WITHOUT_PREFIX" | awk -F. '{print $1"."$2}')
        RELEASE_BRANCH="release_${MAJOR_MINOR//./-}"
        echo "branch=$RELEASE_BRANCH" >> $GITHUB_OUTPUT
        echo "Release branch: $RELEASE_BRANCH"

    - name: Check if release branch exists
      id: check_branch
      env:
        RELEASE_BRANCH: ${{ steps.release_branch.outputs.branch }}
      run: |
        git fetch origin
        if git ls-remote --heads origin "$RELEASE_BRANCH" | grep -q "$RELEASE_BRANCH"; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "Release branch $RELEASE_BRANCH exists"
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "Release branch $RELEASE_BRANCH does not exist"
        fi

    - name: Create release branch
      if: steps.check_branch.outputs.exists == 'false'
      env:
        RELEASE_BRANCH: ${{ steps.release_branch.outputs.branch }}
      run: |
        git checkout -b "$RELEASE_BRANCH"
        git push origin "$RELEASE_BRANCH"
        echo "Created new release branch: $RELEASE_BRANCH"

    - name: Update release branch
      if: steps.check_branch.outputs.exists == 'true'
      env:
        RELEASE_BRANCH: ${{ steps.release_branch.outputs.branch }}
      run: |
        git fetch origin
        git checkout "$RELEASE_BRANCH"
        if ! git merge --ff-only origin/master; then
          echo "Error: Cannot fast-forward release branch $RELEASE_BRANCH to match master branch."
          echo "The release branch may have commits that are not in the master branch."
          exit 1
        fi
        git push origin "$RELEASE_BRANCH"
        echo "Fast-forwarded release branch: $RELEASE_BRANCH"

    # Dispatch the actual release build onto the release branch. A plain
    # `git push` above (authenticated with GITHUB_TOKEN) never fires that
    # workflow's `on: push` trigger — see the `actions: write` permission
    # comment at the top of this job. `gh workflow run` uses the
    # `workflow_dispatch` event, which GitHub does not suppress, so this is
    # the only reliable way to hand off to CI Release branch from here.
    # It resolves the next patch version itself by scanning existing tags
    # against the branch it's dispatched onto, so a first-ever cut for a
    # brand-new release branch and the Nth hotfix on an existing one both
    # come out correctly versioned without this job needing to know which.
    - name: Dispatch release build
      env:
        RELEASE_BRANCH: ${{ steps.release_branch.outputs.branch }}
        # gh does fall back to GITHUB_TOKEN (job-level env, above) when
        # GH_TOKEN is unset, but every other gh-using step in this repo's
        # workflows sets it explicitly — matching that convention here too.
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # On the brand-new-branch path above (as opposed to the fast-forward
        # of an existing branch), this dispatches immediately after the
        # branch's first-ever push — GitHub's ref index for a just-created
        # branch could plausibly lag that push by a beat. Retry a few times
        # rather than fail the whole release on a transient "branch not
        # found"; this is a bounded wait on GitHub's own eventual
        # consistency, not a poll for a long-running task.
        for attempt in 1 2 3 4 5; do
          if gh workflow run ci-release.yml --ref "$RELEASE_BRANCH"; then
            echo "Dispatched CI Release branch workflow on $RELEASE_BRANCH"
            exit 0
          fi
          echo "Dispatch attempt $attempt failed, retrying in 3s..."
          sleep 3
        done
        echo "::error::failed to dispatch CI Release branch on $RELEASE_BRANCH after 5 attempts"
        exit 1
