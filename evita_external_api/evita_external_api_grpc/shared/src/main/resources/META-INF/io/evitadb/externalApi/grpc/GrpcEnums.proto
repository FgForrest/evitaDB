//Enum contains all query execution phases, that leads from request to response.
enum GrpcQueryPhase {
  // Entire query execution time.
  OVERALL = 0;
  // Entire planning phase of the query execution.
  PLANNING = 1;
  // Planning phase of the inner query execution.
  PLANNING_NESTED_QUERY = 2;
  // Determining which indexes should be used.
  PLANNING_INDEX_USAGE = 3;
  // Creating formula for filtering entities.
  PLANNING_FILTER = 4;
  // Creating formula for nested query.
  PLANNING_FILTER_NESTED_QUERY = 5;
  // Creating alternative formula for filtering entities.
  PLANNING_FILTER_ALTERNATIVE = 6;
  // Creating formula for sorting result entities.
  PLANNING_SORT = 7;
  // Creating alternative formula for sorting result entities.
  PLANNING_SORT_ALTERNATIVE = 8;
  // Creating factories for requested extra results.
  PLANNING_EXTRA_RESULT_FABRICATION = 9;
  // Creating factories for requested extra results based on alternative indexes.
  PLANNING_EXTRA_RESULT_FABRICATION_ALTERNATIVE = 10;
  // Entire query execution phase.
  EXECUTION = 11;
  // Prefetching entities that should be examined instead of consulting indexes.
  EXECUTION_PREFETCH = 12;
  // Computing entities that should be returned in output (filtering).
  EXECUTION_FILTER = 13;
  // Computing entities within nested query that should be returned in output (filtering).
  EXECUTION_FILTER_NESTED_QUERY = 14;
  // Sorting output entities and slicing requested page.
  EXECUTION_SORT_AND_SLICE = 15;
  // Fabricating requested extra results.
  EXTRA_RESULTS_FABRICATION = 16;
  // Fabricating requested single extra result.
  EXTRA_RESULT_ITEM_FABRICATION = 17;
  // Fetching rich data from the storage based on computed entity primary keys.
  FETCHING = 18;
  // Fetching referenced entities and entity groups from the storage based on referenced primary keys information.
  FETCHING_REFERENCES = 19;
  // Fetching parent entities from the storage based on parent primary keys information.
  FETCHING_PARENTS = 20;
  // Aggregate phase covering orchestration of all referenced entity loads (predicate setup, ID collection, dedup, recursive dispatch).
  FETCHING_REFERENCE_BODIES = 21;
}

// Contains set of all possible expected states for the entity.
enum GrpcEntityExistence {
  // Entity may or may not exist.
  MAY_EXIST = 0;
  // Entity must not exist.
  MUST_NOT_EXIST = 1;
  // Entity must exist.
  MUST_EXIST = 2;
}

// Contains set of all possible close method behavior types when the session is committed/closed
enum GrpcCommitBehavior {

  // Changes performed in the transaction are passed to evitaDB server, checked for conflicts and if no conflict
  // is found the transaction is marked as completed and commit is finished. This behaviour is fastest, but does
  // not guarantee that the changes are persisted on disk and durable. If the server crashes before the changes
  // are written to disk, the changes are lost.
  WAIT_FOR_CONFLICT_RESOLUTION = 0;

  // Changes performed in the transaction are passed to evitaDB server, checked for conflicts and if no conflict
  // is found, they are written to Write Ahead Log (WAL) and transaction waits until the WAL is persisted on disk
  // (fsynced). After that the transaction is marked as completed and commit is finished. This behaviour is
  // slower than `WAIT_FOR_CONFLICT_RESOLUTION` but guarantees that the changes are persisted on disk and durable. The server
  // may decide to fsync changes from multiple transactions at once, so the transaction may wait longer than
  // necessary. This behaviour still does not guarantee that the changes will be visible immediately after
  // the commit - because they still need to be propagated to indexes in order new data can be found by queries.
  //
  // This behaviour is default.
  WAIT_FOR_LOG_PERSISTENCE = 1;

  // Changes performed in the transaction are passed to evitaDB server, checked for conflicts and if no conflict
  // is found, they are written to Write Ahead Log (WAL). Then the WAL is processed and all changes are propagated
  // to indexes. After that the transaction is marked as completed and commit is finished. This behaviour is
  // slowest but guarantees that the changes are persisted on disk and durable and that they are visible
  // immediately after the commit is marked as completed.
  WAIT_FOR_CHANGES_VISIBLE = 2;

}

// Contains set of all possible transaction phases each transaction goes through.
enum GrpcTransactionPhase {
  // All changes passed conflict resolution steps and are not in conflict with other transactions.
  CONFLICTS_RESOLVED = 0;
  // Changes are written to Write Ahead Log (WAL) and are safely persisted on disk. Client might rely on the fact
  // that the changes will eventually be visible in the database.
  WAL_PERSISTED = 1;
  // Changes are visible in shared state of the database and are available to all newly created sessions.
  CHANGES_VISIBLE = 2;
}

// Contains set of all supported/used naming conventions in evitaDB APIs.
enum GrpcNamingConvention {

  // Camel case: https://en.wikipedia.org/wiki/Camel_case
  CAMEL_CASE = 0;
  // Pascal case: https://www.theserverside.com/definition/Pascal-case
  PASCAL_CASE = 1;
  // Snake case: https://en.wikipedia.org/wiki/Snake_case
  SNAKE_CASE = 2;
  // Capitalized snake case: https://en.wikipedia.org/wiki/Snake_case
  UPPER_SNAKE_CASE = 3;
  // Kebab case: https://en.wikipedia.org/wiki/Letter_case#Kebab_case
  KEBAB_CASE = 4;

}

// This enum represents the possible health problems that can be signaled by the server.
enum GrpcHealthProblem {

  /**
	 * Signalized when the consumed memory never goes below 85% of the maximum heap size and the GC tries to free
	 * old generation at least once (this situation usually leads to repeated attempts of expensive old generation GC
	 * and pressure on system CPUs).
	 */
  MEMORY_SHORTAGE = 0;
  /**
   * Signalized when the readiness probe signals that at least one external API, that is configured to be enabled
   * doesn't respond to internal HTTP check call.
   */
  EXTERNAL_API_UNAVAILABLE = 1;
  /**
   * Signalized when the input queues are full and the server is not able to process incoming requests. The problem
   * is reported when there is ration of rejected tasks to accepted tasks >= 2. This flag is cleared when the rejection
   * ratio decreases below the specified threshold, which signalizes that server is able to process incoming requests
   * again.
   */
  INPUT_QUEUES_OVERLOADED = 2;
  /**
   * Signaled when there are occurrences of Java internal errors. These errors are usually caused by the server
   * itself and are not related to the client's requests. Java errors signal fatal problems inside the JVM.
   */
  JAVA_INTERNAL_ERRORS = 3;

}

// Enum representing overall readiness state of the server API.
enum GrpcReadiness {

  /**
   * At least one API is not ready.
   */
  API_STARTING = 0;
  /**
   * All APIs are ready.
   */
  API_READY = 1;
  /**
   * At least one API that was ready is not ready anymore.
   */
  API_STALLING = 2;
  /**
   * Server is shutting down. None of the APIs are ready.
   */
  API_SHUTDOWN = 3;
  /**
   * Unknown state - cannot determine the state of the APIs (should not happen).
   */
  API_UNKNOWN = 4;

}

// State aggregates the possible states of a task into a simple enumeration.
enum GrpcTaskSimplifiedState {

  /**
		 * Task is waiting in the queue to be executed.
		 */
  TASK_QUEUED = 0;
  /**
   * Task is currently running.
   */
  TASK_RUNNING = 1;
  /**
   * Task has finished successfully.
   */
  TASK_FINISHED = 2;
  /**
   * Task has failed.
   */
  TASK_FAILED = 3;
  /**
   * Task is waiting for precondition to be satisfied.
   */
  TASK_WAITING_FOR_PRECONDITION = 4;

}

// Enum specifies different modes for reference attributes inheritance in reflected schema.
enum GrpcAttributeInheritanceBehavior {
  /**
   * Inherit all attributes by default except those listed in the attribute inheritance filter array.
   */
  INHERIT_ALL_EXCEPT = 0;

  /**
   * Do not inherit any attributes by default except those listed in the attribute inheritance filter array.
   */
  INHERIT_ONLY_SPECIFIED = 1;
}

// Enum describes traits of a GrpcTask task.
enum GrpcTaskTrait {

  /**
   * Task can be manually started by the user.
   */
  TASK_CAN_BE_STARTED = 0;
  /**
   * Task can be manually cancelled by the user.
   */
  TASK_CAN_BE_CANCELLED = 1;
  /**
   * Task needs to be manually stopped by the user (otherwise it will run indefinitely).
   */
  TASK_NEEDS_TO_BE_STOPPED = 2;

}

// Enum describes possible classifier types used in reserved keywords listing
enum GrpcClassifierType {

  /**
	 * Identification of the server instance.
	 */
  CLASSIFIER_TYPE_SERVER_NAME = 0;
  /**
   * Identification of the catalog.
   */
  CLASSIFIER_TYPE_CATALOG = 1;
  /**
   * Identification of the entity type.
   */
  CLASSIFIER_TYPE_ENTITY = 2;
  /**
   * Identification of the attribute.
   */
  CLASSIFIER_TYPE_ATTRIBUTE = 3;
  /**
   * Identification of the associated data (rich content).
   */
  CLASSIFIER_TYPE_ASSOCIATED_DATA = 4;
  /**
   * Identification of the reference.
   */
  CLASSIFIER_TYPE_REFERENCE = 5;
  /**
   * Identification of the reference attribute.
   */
  CLASSIFIER_TYPE_REFERENCE_ATTRIBUTE = 6;

}

// Enum defines the possible scopes where the entities can reside.
enum GrpcEntityScope {

    // Entities that are currently active and reside in the live data set block.
    SCOPE_LIVE = 0;


    // Entities that are no longer active and reside in the archive block.
    SCOPE_ARCHIVED = 1;

}

// Enum defines all supported relation type that can be used in the facet summary impact calculation.
enum GrpcFacetRelationType {

  // Logical OR relation.
  DISJUNCTION = 0;
  // Logical AND relation.
  CONJUNCTION = 1;
  // Logical AND NOT relation.
  NEGATION = 2;
  // Exclusive relations to other facets on the same level, when selected no other facet on that level can be selected.
  EXCLUSIVITY = 3;

}

// Enum defines various level of relationship for which the facet summary calculation rules are defined.
enum GrpcFacetGroupRelationLevel {

  // Defines relation type between two facets in the same group and reference.
  WITH_DIFFERENT_FACETS_IN_GROUP = 0;

  // Defines relation type between two facets in the different groups or references.
  WITH_DIFFERENT_GROUPS = 1;

}

// Enum defines the two modes of traversing a hierarchy when using the `traverseByEntityProperty` ordering constraint.
enum GrpcTraversalMode {

  // The depth-first traversal mode traverses the hierarchy in a depth-first manner, meaning it will
  // explore as far as possible along each branch before backtracking.
  DEPTH_FIRST = 0;

  // The breadth-first traversal mode traverses the hierarchy in a breadth-first manner, meaning it will
  // explore all the nodes at the present depth level before moving on to the nodes at the next depth level.
  BREADTH_FIRST = 1;

}

// Enum represents the type of index that should be created and maintained for a reference.
enum GrpcReferenceIndexType {

  // Reference has no index available.
  REFERENCE_INDEX_TYPE_NONE = 0;

  // Reference has only basic index available that is necessary for ReferenceHaving constraint interpretation.
  REFERENCE_INDEX_TYPE_FOR_FILTERING = 1;

  // Reference has basic index available and also partitioning indexes for the main entity type.
  REFERENCE_INDEX_TYPE_FOR_FILTERING_AND_PARTITIONING = 2;

}

// Enum represents the reference components that should be indexed for a reference.
enum GrpcReferenceIndexedComponents {

  // The referenced entity itself is indexed.
  REFERENCE_INDEXED_COMPONENTS_REFERENCED_ENTITY = 0;

  // The referenced group entity is indexed.
  REFERENCE_INDEXED_COMPONENTS_REFERENCED_GROUP_ENTITY = 1;

}

// Enum represents time flow direction for time-based filtering.
enum GrpcTimeFlow {

  // Time flows forward - from past to future.
  AFTER = 0;
  // Time flows backward - from future to past.
  BEFORE = 1;

}

// Enum represents the per-item override of the conflict resolution granularity applied to a schema element
// (attribute, associated data or reference).
enum GrpcConflictResolutionOverride {

  // The schema element follows the resolved conflict resolution (no explicit override).
  CONFLICT_RESOLUTION_OVERRIDE_INHERITED = 0;
  // Conflicts on this schema element are detected at granular (sub-entity) level.
  CONFLICT_RESOLUTION_OVERRIDE_GRANULAR = 1;
  // Conflicts on this schema element are detected at whole-entity level.
  CONFLICT_RESOLUTION_OVERRIDE_ENTITY = 2;

}

// Enum represents the coarse, mutually exclusive scope at which transaction conflicts are detected.
enum GrpcConflictPolicy {

  // No conflict detection is performed.
  CONFLICT_POLICY_NONE = 0;
  // Conflicts are detected at the catalog level.
  CONFLICT_POLICY_CATALOG = 1;
  // Conflicts are detected at the entity collection level.
  CONFLICT_POLICY_COLLECTION = 2;
  // Conflicts are detected at the entity level.
  CONFLICT_POLICY_ENTITY = 3;

}

// Enum represents a sub-entity refinement of entity-level conflict detection. Granularity is legal only when the
// coarse conflict policy is set to entity level.
enum GrpcGranularConflictPolicy {

  // Conflicts are detected on entity attributes.
  GRANULAR_CONFLICT_POLICY_ENTITY_ATTRIBUTE = 0;
  // Conflicts are detected on references.
  GRANULAR_CONFLICT_POLICY_REFERENCE = 1;
  // Conflicts are detected on reference attributes.
  GRANULAR_CONFLICT_POLICY_REFERENCE_ATTRIBUTE = 2;
  // Conflicts are detected on associated data.
  GRANULAR_CONFLICT_POLICY_ASSOCIATED_DATA = 3;
  // Conflicts are detected on prices.
  GRANULAR_CONFLICT_POLICY_PRICE = 4;
  // Conflicts are detected on hierarchy placement.
  GRANULAR_CONFLICT_POLICY_HIERARCHY = 5;

}

// Represents the conflict resolution setting combining the coarse conflict policy scope with an optional set of
// sub-entity granular refinements. Used as an optional (nullable) field on catalog and entity schemas — an absent
// message means the schema inherits the resolved conflict resolution.
message GrpcConflictResolution {

  // The coarse, mutually exclusive scope at which conflicts are detected.
  GrpcConflictPolicy policy = 1;
  // The set of sub-entity refinements; non-empty only when policy is set to entity level.
  repeated GrpcGranularConflictPolicy granularity = 2;

}

// Independently selectable parts of a catalog or entity collection statistics snapshot. A client names the components
// it wants and the engine computes only those - a component that was not asked for is never computed, and its
// sub-message is absent from the response with no status entry.
//
// A component may exist at the catalog level, at the entity collection level, or at both. The catalog level reports
// aggregates only and never breaks them down per collection, so that its response stays a fixed size no matter how
// many collections the catalog holds; anything about one collection is fetched by naming that collection. Requesting
// a component at a level where it does not exist is an error, not a silently empty result.
enum GrpcCatalogStatisticsComponent {

  // Default value, never valid in a request. Naming it is rejected with an error rather than silently ignored, so
  // a client that forgot to fill the component list is told instead of receiving an identity-only response.
  COMPONENT_UNSPECIFIED = 0;
  // Catalog id, name, state, version, read-only / unusable flags and transactional capabilities. Always delivered
  // whether or not it was requested - no other component can be interpreted without knowing which catalog produced
  // it and whether that catalog is usable. Available at both levels.
  COMPONENT_IDENTITY = 1;
  // Total / live / archived entity counts. The catalog level sums the per-collection counters, the collection level
  // reports the counters of the named collection. Available at both levels.
  COMPONENT_RECORD_COUNTS = 2;
  // Maps to a different sub-message at each level: at the catalog level it is the *inventory* of entity collections
  // (which collections exist, and their entity type primary keys) carrying no statistics at all, while at the
  // collection level it is the header counters of the named collection.
  COMPONENT_COLLECTIONS = 3;
  // Number of sessions currently open against the catalog, split into read-only and read-write. Sessions are opened
  // against a catalog, never against a collection - catalog level only.
  COMPONENT_SESSIONS = 4;
  // The four commit pipeline version watermarks and the lags between them. The pipeline is catalog-wide - catalog
  // level only.
  COMPONENT_COMMIT_PIPELINE = 5;
  // Transaction, mutation and write-ahead log counters together with their short-window rates. Transactions span the
  // whole catalog - catalog level only.
  COMPONENT_ACTIVITY = 6;
  // Disk footprint broken into the classes that have different remedies - live bytes, waste, write-ahead log, files
  // awaiting deletion, bootstrap and the unaccounted remainder. Available at both levels, and the only component
  // still delivered for a catalog that could not be loaded, because file lengths are readable regardless.
  COMPONENT_STORAGE_SIZE = 7;
  // Storage-part histogram - where the bytes actually go, per storage-part type. The catalog level covers the
  // catalog's own data store (schemas, catalog indexes), the collection level the named collection's data store.
  // There is deliberately no cross-collection sum. Available at both levels.
  COMPONENT_STORAGE_COMPOSITION = 8;
  // Active record share, and whether the data store already satisfies the compaction predicate. Available at both
  // levels; the configured thresholds driving that predicate are catalog-wide and reported at the catalog level only.
  COMPONENT_FRAGMENTATION = 9;
  // Time-travel window, retained write-ahead log files and the awaiting-deletion breakdown. The write-ahead log is
  // catalog-wide - catalog level only.
  COMPONENT_HISTORY = 10;
  // Checkpoint cadence, fence depth and files forced - how much replay a crash would cost right now. A property of
  // the catalog's write-ahead log - catalog level only.
  COMPONENT_DURABILITY = 11;
  // Index counts. The catalog level reports the plain total, which every collection answers from a map size; the
  // breakdown by index kind and scope walks the index keys and is therefore collection level only. Available at both
  // levels, with different detail at each.
  COMPONENT_INDEX_SUMMARY = 12;
  // Distinct values and records covered per index. Expensive - never part of a polled refresh. Collection level only,
  // because a catalog-wide form would mean paying that cost for every collection of the catalog at once.
  COMPONENT_INDEX_CARDINALITY = 13;
  // Pending (not yet flushed) state, and the in-memory history retained for sessions that started long ago.
  // Available at both levels.
  COMPONENT_VOLATILE_STATE = 15;

  // 14 held `COMPONENT_MEMORY_FOOTPRINT`, a component that reported a per-index heap estimate. It never shipped in a
  // release and was withdrawn before one: a heap measurement is per *index* rather than per collection, so it is
  // reached through `GetIndexDetail` - which names one index and measures only that - instead of
  // through a component that would have had to measure every index of a collection to answer. Kept reserved rather
  // than reused so a client built against a pre-release proto is answered with an unrecognized-value error rather
  // than being quietly given a different component.
  reserved 14;
  reserved "COMPONENT_MEMORY_FOOTPRINT";

}

// Outcome of computing one requested `GrpcCatalogStatisticsComponent`. Without it a client cannot tell a component it
// never requested from one the engine could not compute - both arrive as an absent sub-message - which is how a
// corrupted catalog ends up rendering as an empty one. A component is reported only if it was requested.
enum GrpcComponentAvailability {

  // Default value, never sent by the server. A status message always carries an explicit availability; receiving this
  // means the message was default-constructed and must not be read as `AVAILABILITY_DELIVERED`.
  AVAILABILITY_UNSPECIFIED = 0;
  // The component was requested and computed - its sub-message is present in the response.
  AVAILABILITY_DELIVERED = 1;
  // The catalog is corrupted and could not be loaded, and this component reads state that only a loaded catalog has.
  // Components reading the file system directly - notably `COMPONENT_STORAGE_SIZE` - stay delivered even then.
  AVAILABILITY_CATALOG_UNUSABLE = 2;
  // The component depends on an engine feature switched off in the current configuration, for example time-travel
  // history when write-ahead log retention is disabled. A configuration change makes it available.
  AVAILABILITY_FEATURE_DISABLED = 3;

  // 4 held `AVAILABILITY_NOT_SUPPORTED`, for a component this server build cannot compute at all. It never shipped in
  // a release and no component ever produced it - every component of this build either answers or is unavailable for
  // one of the two reasons above. It was dropped rather than kept for a hypothetical future producer because adding
  // an enum value is the wire-compatible direction: the day a component genuinely cannot be computed, the value comes
  // back without breaking any client, whereas keeping it forces every client to branch on an outcome no server sends.
  // Kept reserved rather than reused so a client built against a pre-release proto is answered with an
  // unrecognized-value error rather than being quietly given a different availability.
  reserved 4;
  reserved "AVAILABILITY_NOT_SUPPORTED";

}

// Type of entity index, as reported by the per-collection index summary and by an index browse. This is the engine's
// own index type vocabulary rather than a mirror of it, so the values cannot drift apart. A catalog index has no value
// here: the engine addresses those by scope alone because there is exactly one kind of them.
enum GrpcEntityIndexType {

  // Default value, never sent by the server. Every reported index carries an explicit type.
  INDEX_TYPE_UNSPECIFIED = 0;
  // Index covering all entities of the collection.
  INDEX_TYPE_GLOBAL = 1;
  // Index covering entities that reference any entity of a particular referenced entity type.
  INDEX_TYPE_REFERENCED_ENTITY_TYPE = 2;
  // Index covering entities that reference one particular referenced entity.
  INDEX_TYPE_REFERENCED_ENTITY = 3;
  // Index covering entities that reference any entity belonging to a particular group entity type.
  INDEX_TYPE_REFERENCED_GROUP_ENTITY_TYPE = 4;
  // Index covering entities that reference one particular group entity.
  INDEX_TYPE_REFERENCED_GROUP_ENTITY = 5;

}

// What an index browse ranks its results by - the key half of the order, whose other half is the direction carried
// beside it in `GrpcIndexBrowseRequest.direction`. Every key walks every index of the collection; what they differ in
// is how much of that walk has to be kept in memory to produce a page, and what the kept entries are ranked by.
//
// The two halves are separate fields because they are separate choices: the same key read in the other direction
// answers the opposite question (the largest indexes or the smallest, the busiest or the untouched), and every key
// but map order is meaningful both ways.
enum GrpcIndexBrowseOrdering {

  // The order the indexes happen to sit in inside the collection's internal index map. Arbitrary, but stable for
  // a given catalog version, and the cheapest way to page exhaustively through the whole set. Carries no meaning
  // a client should read into.
  //
  // It holds the zero slot, so an unset `ordering` reads as "enumerate everything, cheaply" - the one answer that
  // cannot be mistaken for a ranking the client did not ask for. It is also the one key with no ranking to reverse:
  // it is accepted with direction `ASC` alone, which is how the walk order is spelled, and rejected with `DESC`
  // rather than the direction being silently ignored.
  INDEX_BROWSE_ORDERING_MAP_ORDER = 0;
  // `entityCount`, ties broken deterministically by index kind, then scope, then discriminator - descending for the
  // largest indexes first, ascending for the smallest. The tiebreaker matters: index counts are heavily tied in
  // practice, and without it successive pages would re-order the tied block and show duplicates while hiding other
  // indexes.
  //
  // This is a top-N access pattern - a page is built from a bounded heap rather than a full sort, so the advantage
  // narrows the deeper the requested page is. There is deliberately no ordering by estimated memory: entity count
  // is a single constant-time reading, whereas a memory estimate has to traverse an index, so ordering by it would
  // mean estimating every index in the collection on every call.
  //
  // A catalog browse has nothing for this key to rank by in either direction - a catalog index reports no entity
  // count at all - so there it degenerates to the same order `INDEX_BROWSE_ORDERING_MAP_ORDER` yields, ascending as
  // much as descending. It is accepted rather than rejected so that one client can send the same request to either.
  INDEX_BROWSE_ORDERING_ENTITY_COUNT = 1;
  // `queryCount`, ties broken deterministically by index kind, then scope, then discriminator.
  //
  // Descending answers which indexes are earning the memory they occupy. Read each count against the same row's
  // `observedSince` rather than on its own: the observation window opens per index, so two raw counts only become
  // comparable once each has been divided by its own window. Unlike `INDEX_BROWSE_ORDERING_ENTITY_COUNT` this key is
  // meaningful for a catalog browse too, because a catalog index is queried and maintained like any other.
  //
  // Ascending is the hunt for indexes that may be worth dropping, and it is dominated by ties at zero, because on
  // most catalogs the majority of indexes have never been chosen by a query; the kind-then-scope-then-discriminator
  // tiebreaker is the whole of what makes a page boundary drawn inside that block of zeros reproducible. A zero is
  // not by itself a verdict - it is a statement about the window the row's `observedSince` opens.
  //
  // The rank is a best-effort reading taken as the walk passes each index, not a snapshot of one instant - the
  // counters move under live traffic. Each index is read once, and the count a row reports for the counter it was
  // ranked by is the reading that placed it, so no row contradicts its own position. Pages are nevertheless unstable
  // across calls: recording activity does not advance the catalog version, so two pages agreeing on `catalogVersion`
  // may still have been ranked by counters that moved between them, and one index can appear on two pages or on
  // neither. This is a top-N access pattern - page in `INDEX_BROWSE_ORDERING_MAP_ORDER` to enumerate the whole set -
  // and it is subject to the paging-depth limit documented on `GrpcIndexBrowseRequest.pageNumber`, in both
  // directions.
  INDEX_BROWSE_ORDERING_QUERY_COUNT = 2;
  // `updateCount`, same tiebreaker. Descending, read beside `INDEX_BROWSE_ORDERING_QUERY_COUNT` descending, finds
  // the indexes maintained far more often than they are read. Mind what `GrpcBrowsedIndex.updateCount` documents
  // about the maintenance it counts before acting on the head of that direction: a global index leads it on
  // essentially every catalog and is never a drop candidate, and maintenance driven by a write to another collection
  // is not counted at all.
  //
  // Ascending surfaces the indexes nothing is writing to. It is dominated by ties at zero exactly as
  // `INDEX_BROWSE_ORDERING_QUERY_COUNT` ascending is, and reproducible inside that block for the same reason. A
  // never-updated index is not thereby a drop candidate: it may be precisely the one every query reads, so read it
  // beside `INDEX_BROWSE_ORDERING_QUERY_COUNT` ascending rather than acting on it alone.
  //
  // The caveats on `INDEX_BROWSE_ORDERING_QUERY_COUNT` apply unchanged, in both directions.
  INDEX_BROWSE_ORDERING_UPDATE_COUNT = 3;

}

// Which of an attribute's index structures a cardinality reading describes. One attribute can be indexed several ways
// at once - a filterable AND sortable attribute has both a filter and a sort index - and their distinct-value counts
// are not interchangeable, so a reading always names the structure it came from.
//
// The chain index used for ordered references has no value dimension at all: it stores predecessor links between
// records rather than values, so "distinct values" is not a question that can be asked of it and it is deliberately
// absent here.
enum GrpcAttributeIndexType {

  // Default value, never sent by the server. Every reported cardinality carries an explicit structure.
  ATTRIBUTE_INDEX_TYPE_UNSPECIFIED = 0;
  // The unique index - a value maps to at most one record.
  ATTRIBUTE_INDEX_TYPE_UNIQUE = 1;
  // The filter index - the inverted index used to resolve equality, prefix and range predicates.
  ATTRIBUTE_INDEX_TYPE_FILTER = 2;
  // The sort index - records ordered by their attribute value.
  ATTRIBUTE_INDEX_TYPE_SORT = 3;

}

// What kind of schema element one schema-capability usage row describes. Deliberately not split by owner - an entity
// attribute and a reference attribute are the same kind of thing declared in two places, and
// `GrpcSchemaCapabilityUsage.containerName` already says which place. What this separates is the things that would
// otherwise be indistinguishable: an attribute and a sortable compound may carry the same name in the same container,
// and a reference is both a container of elements and an element in its own right.
enum GrpcSchemaElementKind {

  // Default value, never sent by the server. Every reported row carries an explicit kind.
  SCHEMA_ELEMENT_KIND_UNSPECIFIED = 0;
  // An attribute, of the entity, of one of its references, or of the catalog schema itself.
  SCHEMA_ELEMENT_KIND_ATTRIBUTE = 1;
  // A sortable attribute compound, of the entity or of one of its references.
  SCHEMA_ELEMENT_KIND_SORTABLE_COMPOUND = 2;
  // A reference itself rather than something declared on it - the element carrying `indexed()`, `faceted()` and
  // `bucketed()`. `containerName` is empty on such a row and `elementName` holds the reference name, because a
  // reference is declared by the entity schema directly and has no container of its own. Not to be confused with a
  // row about an attribute *of* that reference, which names it in `containerName` instead.
  SCHEMA_ELEMENT_KIND_REFERENCE = 3;
  // The entity itself - the element carrying `withHierarchy()` and `withPrice()`. Both are declared on the entity
  // schema rather than on anything inside it, so `containerName` is empty and `elementName` repeats the entity type.
  SCHEMA_ELEMENT_KIND_ENTITY = 4;

}

// One flag of a schema element, and one line of maintenance cost the workload either justifies or does not.
//
// The values are named after the schema flags they report - `filterable()`, `sortable()`, `unique()` - which is what
// separates them from `GrpcAttributeIndexType`, whose values name the physical index structure a cardinality reading
// came from. Dropping a flag here takes every physical structure maintaining it with it, and the two axes do not
// correspond even where their names meet: a unique attribute that is not filterable carries
// `SCHEMA_CAPABILITY_FILTERABLE`, because a filter against it is served from its uniqueness index - while no filter
// index exists for it at all. Keeping the two apart is the whole point of the schema-capability surface - see
// `GrpcSchemaCapabilityUsage`.
//
// The values span every schema flag whose maintenance a physical index pays for, and which of them a row can carry is
// fixed by its `GrpcSchemaElementKind`: an attribute has three, a sortable compound exactly one, a reference three of
// its own, and the entity two. Nothing outside that set is reported, because a flag no index maintains costs nothing
// to keep and is therefore not a thing an operator would act on.
enum GrpcSchemaCapability {

  // Default value, never sent by the server. Every reported row carries an explicit capability.
  SCHEMA_CAPABILITY_UNSPECIFIED = 0;
  // The element can be filtered by - `filterable()`, and the inverted indexes it costs. A unique attribute carries
  // this capability too, because uniqueness implies filterability and a filter is served from the uniqueness index.
  SCHEMA_CAPABILITY_FILTERABLE = 1;
  // The element can be ordered by - `sortable()`, and the sorted record arrays it costs.
  SCHEMA_CAPABILITY_SORTABLE = 2;
  // The element's values are unique - `unique()`, whether within the entity collection or globally, and the
  // uniqueness index it costs.
  SCHEMA_CAPABILITY_UNIQUE = 3;
  // The reference can be filtered and summarised as a facet - `faceted()`, and the facet index it costs. Carried by a
  // `SCHEMA_ELEMENT_KIND_REFERENCE` row.
  SCHEMA_CAPABILITY_FACETED = 4;
  // The reference is indexed - `indexed()`, and the reduced entity indexes and reference cardinality index it costs.
  // Carried by a `SCHEMA_ELEMENT_KIND_REFERENCE` row.
  //
  // This is the widest flag reported here, and the one to read most carefully: dropping it takes the whole reduced
  // index family for that reference with it, so every filter, ordering and fetch path reaching *through* the
  // reference stops being answerable - not merely slower. A low request count means far less here than the same
  // number on an attribute's `filterable()`.
  SCHEMA_CAPABILITY_INDEXED = 5;
  // The reference's referenced-entity counts are kept in a bucketed histogram - `bucketed()`, and that index's
  // maintenance. Carried by a `SCHEMA_ELEMENT_KIND_REFERENCE` row.
  SCHEMA_CAPABILITY_BUCKETED = 6;
  // The entity's hierarchy placement is indexed - `withHierarchy()` in an indexed scope, and the hierarchy index it
  // costs. Carried by a `SCHEMA_ELEMENT_KIND_ENTITY` row.
  SCHEMA_CAPABILITY_HIERARCHY_INDEXED = 7;
  // The entity's prices are indexed - `withPrice()` in an indexed scope, and the price indexes it costs. Carried by a
  // `SCHEMA_ELEMENT_KIND_ENTITY` row.
  SCHEMA_CAPABILITY_PRICE_INDEXED = 8;

}
