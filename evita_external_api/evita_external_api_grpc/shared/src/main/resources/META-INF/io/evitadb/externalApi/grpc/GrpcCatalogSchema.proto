syntax = "proto3";

package io.evitadb.externalApi.grpc.generated;
option java_multiple_files = true;
option csharp_namespace = "EvitaDB";

import "GrpcEnums.proto";
import "GrpcEvitaDataTypes.proto";
import "google/protobuf/wrappers.proto";

// Represents the schema of a single catalog - the top-level container that groups related entity collections
// together (analogous to a database / schema in a relational system). Holds the catalog name, its schema version,
// optional description, evolution mode settings, catalog-wide (global) attributes shared across entity types,
// name variants and the conflict resolution policy inherited by entity schemas that don't override it.
message GrpcCatalogSchema {
  // Contains unique name of the catalog. Case-sensitive. Distinguishes one catalog item from another
  // within single entity instance.
  string name = 1;
  // Contains version of this catalog schema and gets increased with any entity type update. Allows to execute
  // optimistic locking i.e. avoiding parallel modifications.
  int32 version = 2;
  // Contains description of the model is optional but helps authors of the schema / client API to better
  // explain the original purpose of the model to the consumers.
  google.protobuf.StringValue description = 3;
  // set of evolution modes that allow to specify how strict is evitaDB when unknown information is presented to her
  // for the first time. When no evolution mode is set, each violation of the catalog schema is
  // reported by an exception. This behaviour can be changed by this evolution mode, however.
  repeated GrpcCatalogEvolutionMode catalogEvolutionMode = 4;
  // Contains index of generally (catalog-wide) shared `AttributeSchema` that could be used as attributes of any
  // entity type that refers them. These attributes cannot be changed from within the entity schema. Entity schemas
  // will not be able to define their own attribute of same name that would clash with the global one (they may only
  // reference the attributes with the same name from the catalog schema).
  //
  // There may be entities that won't take advantage of certain global attributes (i.e. it's not guaranteed that all
  // entity types in catalog have all global attributes).
  //
  // The "catalog-wide" unique attributes allows Evita to fetch entity of any (and up-front unknown) entity type by
  // some unique attribute value - usually URL.
  map<string, GrpcGlobalAttributeSchema> attributes = 5;
  // Contains catalog name converted to different naming conventions.
  repeated GrpcNameVariant nameVariant = 6;
  // Contains the catalog-level conflict resolution setting. When not set (absent), the catalog schema inherits the
  // resolved conflict resolution from the transaction options.
  GrpcConflictResolution conflictResolution = 7;
  // How the catalog splits text of each language into words, keyed by ISO 639 language code. Only declared languages
  // are present; text in any other language is split by the `standard` tokenizer alone. Empty when the server predates
  // fulltext.
  map<string, GrpcFulltextLanguageSchema> fulltextLanguages = 8;
  // Word lists and synonym lists the catalog declares for analysis steps to read, keyed by name. The built-in stop
  // lists are not present. Empty when the server predates fulltext.
  map<string, GrpcFulltextResourceSchema> fulltextResources = 9;
  // Analyzers the catalog declares, keyed by name, before phase inheritance is resolved. The built-in analyzers `text`
  // and `html-text` are not present. Empty when the server predates fulltext.
  map<string, GrpcFulltextAnalyzerSchema> fulltextAnalyzers = 10;
}

// This is the definition object for attributes that are stored along with
// catalog. Definition objects allow to describe the structure of the catalog so that
// in any time everyone can consult complete structure of the catalog. Definition object is similar to Java reflection
// process where you can also at any moment see which fields and methods are available for the class.
//
// Catalog attributes allows defining set of data that are fetched in bulk along with the catalog body.
// Attributes may be indexed for fast filtering or can be used to sort along. Attributes are not automatically indexed
// in order not to waste precious memory space for data that will never be used in search queries.
//
// Filtering in attributes is executed by using constraints like `and`, `or`, `not`. Sorting can be achieved with
// `attributeNatural` or others.
//
// Attributes are not recommended for bigger data as they are all loaded at once when requested.
message GrpcGlobalAttributeSchema {
  // Contains unique name of the attribute. Case-sensitive. Distinguishes one attribute from another within
  // a single entity type or, for global attributes, within the entire catalog.
  string name = 1;
  // optional description of the attribute
  google.protobuf.StringValue description = 2;
  // optional deprecation notice
  google.protobuf.StringValue deprecationNotice = 3;
  // When attribute is unique it is automatically filterable, and it is ensured there is exactly one single entity
  // having certain value of this attribute among other entities in the same collection.
  //
  // As an example of unique attribute can be EAN - there is no sense in having two entities with same EAN, and it's
  // better to have this ensured by the database engine.
  // Deprecated since 2024.12 - deprecated in favor of `uniqueInScopes`
  GrpcAttributeUniquenessType unique = 4 [deprecated = true];
  // When attribute is filterable, it is possible to filter entities by this attribute. Do not mark attribute
  // as filterable unless you know that you'll search entities by this attribute. Each filterable attribute occupies
  // (memory/disk) space in the form of index.
  //
  // When attribute is filterable, extra result `attributeHistogram`
  // can be requested for this attribute.
  // Deprecated since 2024.12 - deprecated in favor of `filterableInScopes`
  bool filterable = 5 [deprecated = true];
  // When attribute is sortable, it is possible to sort entities by this attribute. Do not mark attribute
  // as sortable unless you know that you'll sort entities along this attribute. Each sortable attribute occupies
  // (memory/disk) space in the form of index..
  // Deprecated since 2024.12 - deprecated in favor of `sortableInScopes`
  bool sortable = 6 [deprecated = true];
  // When attribute is localized, it has to be ALWAYS used in connection with specific `Locale`.
  bool localized = 7;
  // When attribute is nullable, its values may be missing in the entities. Otherwise, the system will enforce
  // non-null checks upon upserting of the entity.
  bool nullable = 8;
  // If an attribute is flagged as representative, it should be used in developer tools along with the entity's
  // primary key to describe the entity or reference to that entity. The flag is completely optional and doesn't
  // affect the core functionality of the database in any way. However, if it's used correctly, it can be very
  // helpful to developers in quickly finding their way around the data. There should be very few representative
  // attributes in the entity type, and the unique ones are usually the best to choose.
  bool representative = 9;
  // Data type of the attribute. Must be one of Evita-supported values.
  // Internally the scalar is converted into Java-corresponding data type.
  GrpcEvitaDataType type = 10;
  // Default value is used when the entity is created without this attribute specified. Default values allow to pass
  // non-null checks even if no attributes of such name are specified.
  GrpcEvitaValue defaultValue = 11;
  // Determines how many fractional places are important when entities are compared during filtering or sorting. It is
  // significant to know that all values of this attribute will be converted to `Integer`, so the attribute
  // number must not ever exceed maximum limits of `Integer` type when scaling the number by the power
  // of ten using `indexedDecimalPlaces` as exponent.
  int32 indexedDecimalPlaces = 12;
  // When attribute is unique globally it is automatically filterable, and it is ensured there is exactly one single
  // entity having certain value of this attribute in entire catalog.
  //
  // As an example of unique attribute can be URL - there is no sense in having two entities with same URL, and it's
  // better to have this ensured by the database engine.
  // Deprecated since 2024.12 - deprecated in favor of `uniqueGloballyInScopes`
  GrpcGlobalAttributeUniquenessType uniqueGlobally = 13 [deprecated = true];
  // Contains attribute name converted to different naming conventions.
  repeated GrpcNameVariant nameVariant = 14;
  // When attribute is unique it is automatically filterable, and it is ensured there is exactly one single entity
  // having certain value of this attribute among other entities in the same collection.
  //
  // As an example of unique attribute can be EAN - there is no sense in having two entities with same EAN, and it's
  // better to have this ensured by the database engine.
  repeated GrpcScopedAttributeUniquenessType uniqueInScopes = 15;
  // When attribute is filterable, it is possible to filter entities by this attribute. Do not mark attribute
  // as filterable unless you know that you'll search entities by this attribute. Each filterable attribute occupies
  // (memory/disk) space in the form of index.
  //
  // When attribute is filterable, extra result `attributeHistogram`
  // can be requested for this attribute.
  repeated GrpcEntityScope filterableInScopes = 16;
  // When attribute is sortable, it is possible to sort entities by this attribute. Do not mark attribute
  // as sortable unless you know that you'll sort entities along this attribute. Each sortable attribute occupies
  // (memory/disk) space in the form of index..
  repeated GrpcEntityScope sortableInScopes = 17;
  // When attribute is unique globally it is automatically filterable, and it is ensured there is exactly one single
  // entity having certain value of this attribute in entire catalog.
  //
  // As an example of unique attribute can be URL - there is no sense in having two entities with same URL, and it's
  // better to have this ensured by the database engine.
  repeated GrpcScopedGlobalAttributeUniquenessType uniqueGloballyInScopes = 18;
  // Contains the per-attribute override of the conflict resolution granularity. Defaults to inherited (follow the
  // resolved conflict resolution).
  GrpcConflictResolutionOverride conflictResolutionOverride = 19;
  // The optional accelerations the attribute's filter index maintains, per scope. Only scopes the attribute has a
  // filter index in - i.e. is filterable or unique in - may appear here. An empty list - which is what an older
  // server sends - means no acceleration anywhere.
  repeated GrpcScopedAttributeFilterAccelerators accelerated = 20;

  // Declared normalization steps, applied once in this order to String index keys. Empty means no declared
  // normalization (the engine still uses its default Unicode canonical form). Stored attribute values are unchanged.
  // A populated index can retain an earlier policy until reindexing; this field always reports the declaration.
  repeated GrpcAnalysisStep normalized = 21;
  // Scopes in which the attribute contributes words to the fulltext index. Empty when it is not searchable in any
  // scope, and when the server predates fulltext.
  repeated GrpcEntityScope searchableInScopes = 22;
  // Name of the fulltext analyzer that turns the values into words: a built-in one (`text`, `html-text`) or one the
  // catalog declares. Unset when the server predates fulltext; clients then use the default analyzer `text`.
  google.protobuf.StringValue analyzer = 23;
  // Number of words a value of normal length has; positive. A word found in a shorter value weighs more, in a longer
  // one less. Unset when the server predates fulltext; clients then use the default 25.
  google.protobuf.Int32Value lengthPivot = 24;
  // Fulltext ranking weight of the attribute, shared by every scope; zero preserves matches while contributing no
  // ranking strength. Unset when the server predates fulltext; clients then use the default 1.0, so a set zero
  // differs from an unset wrapper.
  GrpcBigDecimal searchWeight = 25;
}

// Ordered steps of one analyzer phase. Wrapping the list in a message lets an unset phase (undefined, inherited)
// differ from a phase declared with no steps (a set message with an empty list).
message GrpcAnalysisSteps {
  // Steps of the phase in execution order.
  repeated GrpcAnalysisStep steps = 1;
}
// The two phases of an analyzer as it declares them, for every language or for one, before inheritance is resolved.
message GrpcFulltextAnalysisPhases {
  // Text phase: steps changing characters before the text is split into words. Unset when the phase is not declared
  // here, so it is inherited; set with no steps when it is declared empty, which overrides.
  GrpcAnalysisSteps text = 1;
  // Words phase: steps changing each word after splitting. Unset when the phase is not declared here, so it is
  // inherited; set with no steps when it is declared empty, which overrides.
  GrpcAnalysisSteps words = 2;
}
// Content of a word list, such as a stop list or a list of protected words.
message GrpcWordList {
  // Words of the list in declaration order.
  repeated string words = 1;
}
// Words a query treats as equal: a query word of the group also finds the other words of the group.
message GrpcSynonymGroup {
  // Words of the group in declaration order; at least two.
  repeated string words = 1;
}
// Content of a synonym list.
message GrpcSynonymList {
  // Synonym groups in declaration order.
  repeated GrpcSynonymGroup groups = 1;
}
// Content of a fulltext resource, one of the resource kinds.
message GrpcFulltextResourceContent {
  // Exactly one member must be set: the content of the resource's kind.
  oneof content {
    // Content of a word list.
    GrpcWordList wordList = 1;
    // Content of a synonym list.
    GrpcSynonymList synonymList = 2;
  }
}
// How text in one language is split into words.
message GrpcFulltextLanguageSchema {
  // ISO 639 code of the language, such as `en`.
  string language = 1;
  // Splitting steps in execution order, the tokenizer first; never empty.
  repeated GrpcAnalysisStep wordSplitting = 2;
}
// A named list that analysis steps read by its name.
message GrpcFulltextResourceSchema {
  // Name analysis steps refer to the resource by.
  string name = 1;
  // Content of the resource.
  GrpcFulltextResourceContent content = 2;
}
// A named analyzer as the catalog declares it, before inheritance is resolved.
message GrpcFulltextAnalyzerSchema {
  // Name searchable fields refer to the analyzer by.
  string name = 1;
  // Analyzer supplying every phase this one leaves undefined, built-in (`text`, `html-text`) or declared. Unset when
  // the analyzer is based on none; its undefined phases then have no steps.
  google.protobuf.StringValue basedOn = 2;
  // Phases declared for every language.
  GrpcFulltextAnalysisPhases allLanguages = 3;
  // Per-language phase overrides keyed by ISO 639 language code; each phase declared there replaces the
  // all-languages one for that language.
  map<string, GrpcFulltextAnalysisPhases> languages = 4;
  // Author samples in declaration order, independent of the base analyzer. At most 100 distinct, non-blank texts
  // of at most 1,000 UTF-16 code units each; omitted means no samples.
  repeated string samples = 5;
}
