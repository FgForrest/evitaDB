syntax = "proto3";

package io.evitadb.externalApi.grpc.generated;
option java_multiple_files = true;
option csharp_namespace = "EvitaDB";

import "google/protobuf/wrappers.proto";
import "GrpcEntity.proto";
import "GrpcEvitaDataTypes.proto";
import "GrpcEnums.proto";

// A histogram is an approximate representation of the distribution of numerical data. For detailed description please
// see [Wikipedia](https://en.wikipedia.org/wiki/Histogram).

// Histogram can be computed only for numeric based properties. It visualises which property values are more common
// in the returned data set and which are rare. Bucket count will never exceed requested bucket count but there
// may be less of them if there is no enough data for computation. Bucket thresholds are specified heuristically so tha
// there are as few "empty buckets" as possible.
//
// - buckets are defined by their lower bounds (inclusive)
// - the upper bound is the lower bound of the next bucket
message GrpcHistogram {
  // Returns left bound of the first bucket. It represents the smallest value encountered in the returned set.
  GrpcBigDecimal min = 1;
  // Returns right bound of the last bucket of the histogram. Each bucket contains only left bound threshold, so this
  // value is necessary so that first histogram buckets makes any sense. This value is exceptional in the sense that
  // it represents the biggest value encountered in the returned set and represents inclusive right bound for the
  // last bucket.
  GrpcBigDecimal max = 2;
  // Returns count of all entities that are covered by this histogram. It's plain sum of occurrences of all buckets
  // in the histogram.
  int32 overallCount = 3;
  // Data object that carries out threshold in histogram (or bucket if you will) along with number of occurrences in it.
  message GrpcBucket {
    // Contains threshold (left bound - inclusive) of the bucket.
    GrpcBigDecimal threshold = 2;
    // Contains number of entity occurrences in this bucket - e.g. number of entities that has monitored property value
    // between previous bucket threshold (exclusive) and this bucket threshold (inclusive)
    int32 occurrences = 3;
    // Contains true if the `bucket` is overlapping the attribute between filtering constraint
    bool requested = 4;
    // Relative frequency value used for visualization purposes.
    // For standard histograms: percentage of total occurrences (0-100).
    // For equalized histograms: normalized value density (0-100) accounting for both
    // occurrences and bucket width, scaled so all buckets sum to 100. Higher values
    // indicate denser data concentration in this bucket.
    GrpcBigDecimal relativeFrequency = 5;
  }
  // Returns histogram buckets that represents a tuple of occurrence count and the minimal threshold of the bucket
  // values.
  repeated GrpcBucket buckets = 4;
  // Referenced entity whose value anchors the minimum bucket of the histogram. Populated only for
  // reference-scope histograms when an entity fetch is requested for the associated reference.
  GrpcSealedEntity minReferencedEntity = 5;
  // Referenced entity whose value anchors the maximum bucket of the histogram. Populated only for
  // reference-scope histograms when an entity fetch is requested for the associated reference.
  GrpcSealedEntity maxReferencedEntity = 6;
}

// This DTO contains information about single reference group and statistics of the references that relates to it.
message GrpcReferenceGroupStatistics {
  // Contains name of the facet group.
  string referenceName = 1;
  // Contains referenced entity reference representing this group.
  GrpcEntityReference groupEntityReference = 2;
  // Contains referenced entity representing this group.
  GrpcSealedEntity groupEntity = 3;
  // Contains number of distinct entities in the response that possess any reference in this group.
  int32 count = 4;
  // Contains statistics of individual facets.
  repeated GrpcFacetStatistics facetStatistics = 5;
  // Contains named histogram statistics for this reference group. Each histogram index defined on the
  // reference schema produces a separate histogram entry keyed by the histogram index name.
  map<string, GrpcHistogram> histogramStatistics = 6;
}

// This DTO contains information about single facet group and statistics of the facets that relates to it.
// Deprecated since 2026.2 - deprecated in favor of `GrpcReferenceGroupStatistics`, produced by the
// `referenceSummary` requirement
// TOBEDONE: remove when FacetSummary constraint is removed (https://github.com/FgForrest/evitaDB/issues/538)
message GrpcFacetGroupStatistics {
  option deprecated = true;

  // Contains name of the facet group.
  string referenceName = 1;
  // Contains referenced entity reference representing this group.
  GrpcEntityReference groupEntityReference = 2;
  // Contains referenced entity representing this group.
  GrpcSealedEntity groupEntity = 3;
  // Contains number of distinct entities in the response that possess any reference in this group.
  int32 count = 4;
  // Contains statistics of individual facets.
  repeated GrpcFacetStatistics facetStatistics = 5;
}

// This DTO contains information about single facet statistics of the entities that are present in the response.
message GrpcFacetStatistics {
  // Contains referenced entity reference representing.
  GrpcEntityReference facetEntityReference = 1;
  // Contains referenced entity representing.
  GrpcSealedEntity facetEntity = 2;
  // Contains TRUE if the facet was part of the query filtering constraints.
  bool requested = 3;
  // Contains number of distinct entities in the response that possess of this reference.
  int32 count = 4;
  // This field is not null only when this facet is not requested.
  // Contains projected impact on the current response if this facet is also requested in filtering constraints.
  google.protobuf.Int32Value impact = 5;
  // Projected number of filtered entities if the query is altered by adding this facet to filtering constraint.
  google.protobuf.Int32Value matchCount = 6;
  // Selection has sense - TRUE if there is at least one entity still present in the result if
  // the query is altered by adding this facet to filtering query. In case of OR relation between
  // facets it's also true only if there is at least one entity present in the result when all other
  // facets in the same group are removed and only this facet is requested.
  bool hasSense = 7;
}

// Contains list of statistics for the single level (probably root or whatever is filtered by the query) of
// the queried hierarchy entity.
message GrpcHierarchy {
  // Map holds the statistics represented by user-specified output name of requested hierarchy.
  map<string, GrpcLevelInfos> hierarchy = 1;
}

// This DTO represents a wrapper for array of statistics for the single hierarchy level of inner entities.
message GrpcLevelInfos {
  // Array of statistics for the single hierarchy level of inner entities.
  repeated GrpcLevelInfo levelInfos = 1;
}

// This DTO represents single hierarchical entity in the statistics tree. It contains identification of the entity,
// the cardinality of queried entities that refer to it and information about children level.
message GrpcLevelInfo {
  // Hierarchical entity reference at position in tree represented by this object.
  GrpcEntityReference entityReference = 1;
  // Hierarchical entity at position in tree represented by this object.
  GrpcSealedEntity entity = 2;
  // Contains the number of queried entities that refer directly to this `entity` or to any of its children
  // entities.
  google.protobuf.Int32Value queriedEntityCount = 3;
  // Contains number of hierarchical entities that are referring to this `entity` as its parent.
  // The count will respect behaviour settings and will not count empty children in case `REMOVE_EMPTY` is
  // used for computation.
  google.protobuf.Int32Value childrenCount = 4;
  // Contains hierarchy info of the entities that are subordinate (children) of this `entity`.
  repeated GrpcLevelInfo items = 5;
  // Contains true if the `entity` was filtered by hierarchy within constraint
  bool requested = 6;
}

// This DTO contains detailed information about query processing time and its decomposition to single operations.
message GrpcQueryTelemetry {
  // Phase of the query processing.
  GrpcQueryPhase operation = 1;
  // Number of nanoseconds elapsed since the root step of this telemetry tree began - the root step itself
  // therefore always reports 0. This is not a wall-clock timestamp and must not be rendered as a date.
  int64 start = 2;
  // Internal steps of this telemetry step (operation decomposition).
  repeated GrpcQueryTelemetry steps = 3;
  // Arguments of the processing phase.
  repeated string arguments = 4;
  // Duration in nanoseconds, covering this step and everything nested below it.
  int64 spentTime = 5;
  // Wall-clock instant at which the query began. Set only on the root step - it anchors the whole tree in time,
  // so the wall-clock position of any other node is startedAt plus that node's start offset.
  GrpcOffsetDateTime startedAt = 6;
  // Duration in nanoseconds this step spent on its own work - its spentTime less the time accounted for by its
  // direct children. A parent's spentTime is not the sum of its children's, so this is the number that says how
  // much of a phase is the phase itself rather than the phases inside it.
  //
  // This is a server-derived convenience, not part of the telemetry object's identity: the engine does not track
  // it, and the Java driver does not reconstruct it when it rebuilds the tree from this message. It is emitted so
  // that clients which consume the wire format directly do not each have to sum the children themselves.
  int64 selfTime = 7;
  // Typed numeric measurements recorded for this step - cardinalities, costs and I/O counters the engine computed
  // while answering the query. Unlike `arguments`, which is prose, these are values a client can compare and chart
  // without parsing English. Absent when nothing was measured for this step, which is the case for every step but
  // the root.
  optional GrpcQueryTelemetryMetrics metrics = 8;
  // Structure of the formula this phase built or ran. Present only when the query asked for it with
  // queryTelemetry(PLAN), and then only on the phases that own a formula: each PLANNING_FILTER_ALTERNATIVE step
  // carries the candidate it costed - including the ones that lost - and the root carries the plan that ran.
  optional GrpcFormulaPlan plan = 9;
}

// One node of the formula plan a query phase was carried out with - the structural counterpart of the timings.
//
// The plan is a DAG rather than a tree: a formula's result is memoized per instance, so a subtree reachable by two
// paths is computed once and every later occurrence of it is free. `refTo` is what keeps a reader from counting such
// a subtree twice - the first occurrence is described in full, and every later one is a bare node pointing back at
// it by id, with no children of its own.
//
// actualCost and resultCount are absent whenever the formula was not computed, which is the normal state for a
// rejected plan alternative and for a short-circuited branch of the winning one. They are absent rather than 0
// because the plan is rendered without ever computing anything: filling them in would make asking for the plan
// change what the query does.
message GrpcFormulaPlan {
  // Identity of the formula instance this node stands for, unique within the plan and stable across its
  // occurrences - it is what makes "computed once, reused twice" visible.
  int32 id = 1;
  // Absent on the occurrence that describes the instance; equal to `id` on every later occurrence, which carries no
  // detail and no children and means "see the node with this id".
  optional int32 refTo = 2;
  // Structural hash of the formula, i.e. what the cache keys on. Two nodes with the same hash are interchangeable
  // computations, whereas two nodes with the same id are the same object - the two answer different questions.
  int64 hash = 3;
  // Human readable description of the formula. Absent on a back-reference node.
  optional string description = 4;
  // Cost the planner estimated for this formula before running anything.
  int64 estimatedCost = 5;
  // Cost the formula really incurred. Absent when it was never computed.
  optional int64 actualCost = 6;
  // Number of records the formula produced. Absent when it was never computed.
  optional int32 resultCount = 7;
  // Inner formulas. Always empty on a back-reference node.
  repeated GrpcFormulaPlan children = 8;
}

// Typed numeric measurements recorded for a single query telemetry step.
//
// Every field is optional and absence is meaningful: a metric is recorded where the engine happens to compute the
// number, so a missing one means "not measured for this phase". That is deliberately distinct from a measured 0,
// which recordsReturned, ioFetchCount, ioFetchedSizeBytes and prefetched can all legitimately be - which is also
// why these are `optional` rather than plain scalars, since proto3 implicit presence cannot tell the two apart.
message GrpcQueryTelemetryMetrics {
  // How many records the planner expected the filtering formula to match. Compare against actualCardinality - an
  // estimate that is orders of magnitude off is why the engine chose the index it chose, and it is the usual
  // explanation for a plan that looks wrong.
  optional int64 estimatedCardinality = 1;
  // How many records the filtering formula really matched, before the requested page was cut out of them. This
  // counts what the filter found, not what was returned - recordsReturned is the latter.
  optional int64 actualCardinality = 2;
  // Cost the planner estimated for the filtering formula it chose. This is the unitless scale candidate indexes are
  // ranked on - comparable between plans of the same query, meaningless in absolute terms. Absent when the estimate
  // overflowed.
  optional int64 estimatedCost = 3;
  // Cost the filtering formula really incurred, computed from the real cardinalities once it ran. Compare against
  // estimatedCost on the same scale. Absent when the formula was never computed.
  optional int64 actualCost = 4;
  // How many records were actually handed back, i.e. the size of the page cut out of actualCardinality.
  // Legitimately 0 for a query whose requested page lies past the end of the result.
  optional int64 recordsReturned = 5;
  // How many times the storage was read while assembling the response. Legitimately 0 - a query answered entirely
  // from indexes, or one returning bare primary keys, never touches storage.
  optional int64 ioFetchCount = 6;
  // How many bytes were read from the storage while assembling the response. Reported alongside ioFetchCount
  // because many small reads and one large read cost very differently.
  optional int64 ioFetchedSizeBytes = 7;
  // Whether the planner prefetched entity bodies and filtered over them instead of consulting indexes. It explains
  // the shape of the rest of the profile rather than measuring anything: a prefetched query spends its time in
  // EXECUTION_PREFETCH and barely touches the index phases.
  optional bool prefetched = 8;
}

// This DTO contains extra results that are computed based on the query results.
message GrpcExtraResults {
  // Returns computed histograms for specific attributes based on filter constraints.
  //
  // A histogram is an approximate representation of the distribution of numerical data. For detailed description please
  // see [WikiPedia](https://en.wikipedia.org/wiki/Histogram).
  // Histogram can be computed only for numeric based properties. It visualises which property values are more common
  // in the returned data set and which are rare. Bucket count will never exceed requested bucket count specified in
  // `requestedCount` but there
  // may be less of them if there is no enough data for computation. Bucket thresholds are specified heuristically so that
  // there are as few "empty buckets" as possible.
  //
  // - buckets are defined by their lower bounds (inclusive)
  // - the upper bound is the lower bound of the next bucket
  map<string, GrpcHistogram> attributeHistogram = 1;
  // Returns computed histogram for prices satisfactory to filter constraints.
  //
  // A histogram is an approximate representation of the distribution of numerical data. For detailed description please
  // see [WikiPedia](https://en.wikipedia.org/wiki/Histogram).
  // Histogram can be computed only for numeric based properties. It visualises which property values are more common
  // in the returned data set and which are rare. Bucket count will never exceed requested bucket count specified in
  // `requestedCount` but there
  // may be less of them if there is no enough data for computation. Bucket thresholds are specified heuristically so that
  // there are as few "empty buckets" as possible.
  //
  // - buckets are defined by their lower bounds (inclusive)
  // - the upper bound is the lower bound of the next bucket
  GrpcHistogram priceHistogram = 2;
  // Contains a collection of FacetGroupStatistics DTOs where each of them contains information about single facet group
  // (if they belong in one) and statistics of the facets that relates to it.
  // Deprecated since 2026.2 - renamed to `referenceGroupStatistics`
  repeated GrpcFacetGroupStatistics facetGroupStatistics = 3 [deprecated = true];
  // Contains list of statistics for the single level (probably root or whatever is filtered by the query) of
  // the queried hierarchy entity.
  GrpcHierarchy selfHierarchy = 4;
  // Index holds the statistics for particular references that target hierarchy entity types.
  // Key is the identification of the reference name, value contains list of statistics for the single level (probably
  // root or whatever is filtered by the query) of the hierarchy entity.
  map<string, GrpcHierarchy> hierarchy = 5;
  // This DTO contains detailed information about query processing time and its decomposition to single operations.
  GrpcQueryTelemetry queryTelemetry = 6;
  // Contains a collection of ReferenceGroupStatistics DTOs where each of them contains information about single reference group
  // (if they belong in one) and statistics of the references that relates to it.
  repeated GrpcReferenceGroupStatistics referenceGroupStatistics = 7;
}
