        parameterValues(
          filterBy: {
            entityHaving: {
              attributeCodeStartsWith: "ram-memory"
            }
          }
        ) {
          referencedPrimaryKey
          referencedEntity {
            primaryKey
            attributes {
              code
            }
          }
          groupEntity {
            primaryKey
            attributes {
              code
            }
          }
        }
      }
    }
  }
