{
  queryProduct(
    filterBy: {
      hierarchyCategoriesWithin: {
        ofParent: {
          attributeCodeEquals: "macbooks"
        }
      },
      referenceParameterValuesHaving: [
        {
          groupHaving: {
            attributeCodeEquals: "ram-memory"
          }
        }
      ]
    }
  ) {
    recordPage(size: 5) {
      data {
        primaryKey
        attributes {
          code
        }
        parameterValues(
          filterBy: {
            entityHaving: {
              attributeCodeStartsWith: "ram-memory"
            }
          }
        ) {
          referencedPrimaryKey
          attributes {
            variant
          }
          referencedEntity {
            primaryKey
            attributes {
              code
            }
          }
          groupEntity {
            primaryKey
            attributes {
              code
            }
          }
        }
      }
    }
  }
}