{
  queryProduct(
    filterBy: {
      referenceBrandHaving: [
        {
          entityHaving: {
            attributeCodeEquals: "asus"
          }
        }
      ],
      userFilter: [
        {
          facetCategoriesHaving: {
            entityHaving: {
              attributeCodeEquals: "laptops"
            },
            includingChildrenHaving: {
              attributeCodeContains: "books"
            }
          }
        }
      ]
    }
  ) {
    extraResults {
      referenceSummary {
        categories {
          count
          facetStatistics {
            requested
            count
            impact {
              difference
              matchCount
              hasSense
            }
            facetEntity {
              primaryKey
              attributes {
                code
              }
            }
          }
        }
      }
    }
  }
}