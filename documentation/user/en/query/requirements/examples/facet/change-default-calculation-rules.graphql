{
  queryProduct(
    require: {
      facetCalculationRules: {
        facetsWithSameGroup: CONJUNCTION,
        facetsWithDifferentGroups: EXCLUSIVITY
      }
    }
  ) {
    extraResults {
      referenceSummary {
        parameterValues {
          count
          groupEntity {
            primaryKey
          }
          facetStatistics {
            requested
            count
            impact {
              difference
              matchCount
              hasSense
            }
            facetEntity {
              primaryKey
              attributes {
                code
              }
            }
          }
        }
      }
    }
  }
}