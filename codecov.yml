coverage:
  status:
    project:
      default:
        target: 70%
        threshold: 3%
    patch:
      default:
        target: auto
        threshold: 1%

ignore:
  - "evita_query/src/main/java/io/evitadb/api/query/parser/grammar/**"
  - "evita_query/src/main/java/io/evitadb/api/query/expression/parser/grammar/**"
  - "evita_external_api/evita_external_api_grpc/shared/src/main/java/io/evitadb/externalApi/grpc/generated/**"
  - "evita_roaring_bitmap/src/main/java/**"
  # evita_test_support: the pure helper packages (builder, utils, duration, client/query
  # converters, generator, top-level helpers) are unit-tested and counted; only the
  # integration-only glue below stays excluded (needs a live server / JUnit engine / is markup)
  - "evita_test_support/src/main/java/io/evitadb/test/extension/**"
  - "evita_test_support/src/main/java/io/evitadb/test/tester/**"
  - "evita_test_support/src/main/java/io/evitadb/test/annotation/**"
  # DataGenerator is exercised only by the full functional suite (not by unit tests); excluded
  # until its full-suite line coverage is confirmed on CI, to avoid dragging the project number
  - "evita_test_support/src/main/java/io/evitadb/test/generator/**"
  - "evita_test_support/src/main/java/io/evitadb/test/client/ApiClient.java"
  - "evita_test_support/src/main/java/io/evitadb/test/client/GraphQLClient.java"
  - "evita_test_support/src/main/java/io/evitadb/test/client/RestClient.java"
  - "evita_performance_tests/src/main/java/io/evitadb/performance/**"
  - "**.*Exception.java"

comment:
  layout: "header, diff, files"
  behavior: default
  require_changes: false
